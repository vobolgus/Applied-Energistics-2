// Root project: shared conventions only. The mod itself is built per-loader:
//   :neoforge (loader/neoforge) — ModDevGradle
//   :fabric   (loader/fabric)   — fabric-loom
// Both compile the shared sources in /src/main/java and /src/client/java.

plugins {
    id 'com.diffplug.spotless'
}

apply plugin: appengbuild.CrowdinPlugin

import com.diffplug.gradle.spotless.JsonExtension

/////////////
// Spotless
spotless {

    java {
        target 'src/*/java/appeng/**/*.java', 'loader/*/src/*/java/appeng/**/*.java'

        endWithNewline()
        indentWithSpaces()
        removeUnusedImports()
        toggleOffOn()
        eclipse().configFile 'codeformat/codeformat.xml'
        importOrderFile 'codeformat/ae2.importorder'

        // courtesy of diffplug/spotless#240
        // https://github.com/diffplug/spotless/issues/240#issuecomment-385206606
        custom 'noWildcardImports', {
            if (it.contains('*;\n')) {
                throw new Error('No wildcard imports allowed')
            }

            it
        }
        bumpThisNumberIfACustomStepChanges(1)
    }

   json {
        target 'src/*/resources/**/*.json', 'loader/*/src/*/resources/**/*.json'
        targetExclude 'src/generated/resources/**'
        var biomeConfig = it.new JsonExtension.BiomeJson(null)
        try {
            biomeConfig.downloadDir(new File(rootDir, ".gradle/biome").absolutePath)
        } catch (Exception ignored) {
        }
        addStep(biomeConfig.createStep())
        indentWithSpaces(2)
        endWithNewline()
    }
}
