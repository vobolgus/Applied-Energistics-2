org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all

java_version=25

# Version pin for the Fabric port branch (same convention as the GuideME fabric port).
# buildSrc's ProjectVersionSource derives the version from `git describe --tags`, but this fork
# carries no git tags (GitHub forks don't copy them), so every build - local and CI - would fall
# back to 0.0.0-SNAPSHOT (and the fabric.mod.json "version" field with it). The branch is rebased
# onto upstream's v26.1.10-beta tag, so pin exactly that version. Deliberately a gradle
# property (read first by appengbuild.ProjectDefaultsPlugin) instead of a buildSrc change: zero
# upstream-rebase surface in build logic. Drop this line if the upstream tags are ever fetched
# into the fork; bump it deliberately per release.
version=26.1.10-beta.5

#########################################################
# Minecraft Versions                                    #
#########################################################
minecraft_version=26.1.2
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.21-beta
neoforge_version_range=[26.1.2.21-beta,)

#########################################################
# Fabric                                                #
#########################################################
# https://meta.fabricmc.net/v2/versions/loader
fabric_loader_version=0.19.3
# https://modrinth.com/mod/fabric-api/versions?g=26.1.2
fabric_api_version=0.151.0+26.1.2
# https://maven.modmuss50.me/teamreborn/energy/
tr_energy_version=5.0.0
# Published to mavenLocal by the GuideME Fabric port (../GuideME) until released upstream
guideme_fabric_version=26.1.12-beta.2

# Compile the shared MAIN sources (src/main) in :fabric as well (Phase 2a).
ae2.fabric.shared=true
# Compile the shared CLIENT sources (src/client) in :fabric (Phase 3a).
ae2.fabric.client=true

#########################################################
# Provided APIs                                         #
#########################################################
guideme_version=26.1.12-beta
# Shared by both loaders: maven.blamejared.com publishes jei-26.1.2-neoforge(-api) AND jei-26.1.2-fabric(-api)
# for the same version (29.5.0.26 verified present for both; the shared plugin code compiles against the
# common API that both loader api artifacts pull in transitively).
jei_version=29.5.0.26
jei_minecraft_version=26.1.2
emi_version=1.1.19+1.21.1
jade_version_range=[26.0.0,)
# NOTE (fabric/REI restoration): 21.11.814 is the newest REI release as of 2026-06-12; it targets MC 1.21.11,
# NOT 26.1 (no REI build for 26.1 exists yet on maven.shedaniel.me/Modrinth/CurseForge). It was bumped from the
# upstream 21.9.812 pin because the 21.9 line is compiled against pre-1.21.11 mojmap (net.minecraft.resources
# .ResourceLocation), whose abstract API methods (e.g. Display#getDisplayLocation) cannot be implemented on
# 26.1 at all; the 21.11 line uses the Identifier-renamed mojmap that 26.1 inherited. The -neoforge artifacts
# are mojmap and serve as the compile-time API for BOTH loaders; runtime REI stays unavailable until REI ships
# a 26.1 build (see PORTING_NOTES.md "REI restoration").
rei_version=26.1.819
# Transitive deps of REI (dev.architectury.fluid.FluidStack is REI's fluid entry type; me.shedaniel.math is REI's
# geometry API); pinned for :fabric where REI's pom transitives are deliberately not resolved.
architectury_version=19.0.1
cloth_basic_math_version=0.6.1
wthit_version=19.0.1
# WTHIT's runtime dependency (fabric flavor resolves from maven2.bai.lol like wthit itself).
# https://modrinth.com/mod/badpackets/versions?g=26.1.2&l=fabric
badpackets_version=0.12.2
jade_file_id=7938398
# Jade for Fabric from the Modrinth maven (the curse.maven file id above is the NeoForge file).
# https://modrinth.com/mod/jade/versions?g=26.1&l=fabric
jade_fabric_version=26.1.0+fabric
curios_version=15.0.0-beta.2+26.1.2
# Trinkets is the Fabric counterpart of Curios; the pin is Patbox's maintained fork ("Trinkets Updated",
# mod id trinkets_updated, API package eu.pb4.trinkets.api). :fabric only — compile-time API for
# appeng.fabric.integration.trinkets, plus the dev-runtime toggle below.
# https://modrinth.com/mod/trinkets-updated/versions?g=26.1.2&l=fabric
trinkets_fabric_version=4.0.0-beta.3+26.1
athena_version=4.7.3
athena_file_id=7970442

#
# Enable athena at runtime
runtime_athena=false

# Pick which item list mod gets picked at runtime in dev
# Available options: emi, rei, jei, none
runtime_itemlist_mod=rei

# Set to wthit, jade or none to pick which tooltip mod gets picked at runtime
# for the dev environment.
runtime_tooltip_mod=jade

# Set to true to use Curio at runtime
runtime_curio=false

# Set to true to use Trinkets at runtime (:fabric, the Curios counterpart)
runtime_trinkets=false

#########################################################
# Third party dependencies
#########################################################
snakeyaml_version=1.33
# TOML config backend for the Fabric loader (NeoForge bundles the same library)
night_config_version=3.8.3
directory_watcher_version=0.17.1
junit_version=5.10.2
flatbuffers_version=23.5.26
ffmpeg_version=6.0-1.5.9
assertj_version=3.26.0
mockito_version=5.21.0

#########################################################
# Gradle                                                #
#########################################################

# Temp fix for Spotless / Remove Unused Imports:
# https://github.com/diffplug/spotless/issues/834
org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
